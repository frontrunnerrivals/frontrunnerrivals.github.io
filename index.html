<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Front Runner Rivals</title>
<meta name="description" content="Front Runner Rivals — arcade horse racing for iPhone and Android.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#120a2e;--fg:#f1eefc;--muted:#b9b2d8;--gold:#ffd660}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0%,#3a2678 0%,#120a2e 60%);color:var(--fg);font:400 18px/1.6 "Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
main{max-width:640px;padding:48px 16px;text-align:center}
h1{font:italic 700 clamp(44px,10vw,76px)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--gold);margin:0 0 12px;letter-spacing:.01em}
p{color:var(--muted);margin:0 0 28px}
nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{color:#120a2e;background:var(--gold);padding:10px 20px;border-radius:999px;text-decoration:none;font-weight:600}
footer{margin-top:36px;font-size:15px;color:var(--muted)}
footer a{background:none;color:var(--muted);padding:0;text-decoration:underline;font-weight:400}
</style>
</head>
<body>
<main>
  <h1>Front Runner Rivals</h1>
  <p>Arcade horse racing for iPhone and Android. Pick your horse, master 12 tracks around the world and race for the world rankings.</p>
  <nav><a href="privacy.html">Privacy Policy</a><a href="mailto:frontrunnerrivals@gmail.com">Support</a></nav>
  <footer>Contact: <a href="mailto:frontrunnerrivals@gmail.com">frontrunnerrivals@gmail.com</a></footer>
</main>
</body>
</html>
